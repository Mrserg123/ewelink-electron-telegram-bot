name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build bot
        run: npm run build

      - name: Rename file for release
        run: mv dist/index.js dist/bot-bundle.js

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bot-bundle.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
